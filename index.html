<title>TBFE Mobile</title>
<style>
/* Layout: one column for the phone - sticky header, account strip, account view with tabs. Same look as the MT5 panel. */
:root{
  --bg:#0E1320; --bg2:#111827; --card:#151C2C; --card2:#192235; --line:#222C42; --txt:#E9EEF7; --sec:#A3AEC2; --mut:#6B7891;
  --acc:#4F8CFF; --acc2:#8B5CF6; --green:#34D399; --red:#F87171; --amber:#FBBF24; --gold:#F2C14E; --track:#283349;
  --zebra:#121A29; --onacc:#FFFFFF; --shadow:0 10px 30px rgba(0,0,0,.35);
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono:ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
:root[data-skin="carbon"]{
  --bg:#0B0B0C; --bg2:#101011; --card:#151514; --card2:#1B1A18; --line:#27251F; --txt:#F6F2E8; --sec:#B5AE9E; --mut:#7C7669;
  --acc:#E9B949; --acc2:#C2410C; --green:#4ADE80; --red:#F87171; --amber:#FBBF24; --gold:#E9B949; --track:#2B2924;
  --zebra:#111111; --onacc:#15130F; color-scheme: dark;
}
:root[data-skin="light"]{
  --bg:#F3F5F9; --bg2:#EDF1F7; --card:#FFFFFF; --card2:#F8FAFD; --line:#DFE4ED; --txt:#162033; --sec:#4D596F; --mut:#8590A4;
  --acc:#2563EB; --acc2:#7C3AED; --green:#059669; --red:#DC2626; --amber:#D97706; --gold:#B7791F; --track:#E3E8F0;
  --zebra:#F7F9FC; --onacc:#FFFFFF; --shadow:0 8px 24px rgba(22,32,51,.10); color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:var(--font);font-size:15px;line-height:1.35}
body{padding-left:max(14px, env(safe-area-inset-left, 0px));padding-right:max(14px, env(safe-area-inset-right, 0px));
     padding-bottom:calc(24px + env(safe-area-inset-bottom, 0px));min-height:100vh}
button{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.up{color:var(--green)} .dn{color:var(--red)} .mut{color:var(--mut)} .sec{color:var(--sec)}
.k0{color:var(--txt)} .k1{color:var(--green)} .k2{color:var(--red)} .k3{color:var(--amber)} .k4{color:var(--acc)} .k5{color:var(--gold)} .k6{color:var(--mut)}

/* header */
.top{position:sticky;top:0;z-index:20;margin:0 calc(-1 * max(14px, env(safe-area-inset-left, 0px))) 0;
     padding:calc(10px + env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px));
     background:linear-gradient(180deg, color-mix(in srgb, var(--bg) 92%, transparent), color-mix(in srgb, var(--bg) 82%, transparent));
     -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);
     display:flex;align-items:center;gap:12px}
.logo{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;
      background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 6px 16px color-mix(in srgb, var(--acc) 35%, transparent)}
.ttl{flex:1;min-width:0}
.ttl b{display:block;font-size:17px;letter-spacing:.2px}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sec);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:8px;height:8px;border-radius:50%;background:var(--mut);flex:none}
.dot.on{background:var(--green);box-shadow:0 0 0 0 color-mix(in srgb, var(--green) 60%, transparent);animation:pulse 2s infinite}
.dot.warn{background:var(--amber)} .dot.off{background:var(--red)}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--green) 55%, transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--card);display:grid;place-items:center;cursor:pointer}
.icon-btn svg{width:19px;height:19px;stroke:var(--txt)}

/* banner */
.banner{margin:12px 0 0;padding:10px 12px;border-radius:12px;font-size:13px;display:flex;gap:10px;align-items:flex-start;
        background:color-mix(in srgb, var(--amber) 14%, var(--card));border:1px solid color-mix(in srgb, var(--amber) 35%, transparent)}
.banner.err{background:color-mix(in srgb, var(--red) 13%, var(--card));border-color:color-mix(in srgb, var(--red) 35%, transparent)}
.banner.demo{background:color-mix(in srgb, var(--acc) 12%, var(--card));border-color:color-mix(in srgb, var(--acc) 35%, transparent)}
.banner b{white-space:nowrap}
.banner button{margin-left:auto;flex:none;border:0;border-radius:9px;padding:6px 10px;background:var(--acc);color:var(--onacc);font-weight:600;font-size:12px;cursor:pointer}

/* summary + account strip */
.sum{display:flex;gap:8px;margin:14px 0 10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 10px;font-size:11.5px;font-weight:600;letter-spacing:.2px;
      background:color-mix(in srgb, currentColor 14%, transparent);white-space:nowrap}
.strip{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 6px;margin:0 -2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.acc{flex:none;width:158px;scroll-snap-align:start;border-radius:16px;padding:11px 12px;background:var(--card);border:1px solid var(--line);
     cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:5px;position:relative}
.acc.sel{border-color:var(--acc);background:linear-gradient(180deg, color-mix(in srgb, var(--acc) 16%, var(--card)), var(--card));box-shadow:var(--shadow)}
.acc .row{display:flex;align-items:center;gap:6px}
.role{font-size:10px;font-weight:700;letter-spacing:.6px;padding:2px 7px;border-radius:999px}
.role.S{color:var(--acc);background:color-mix(in srgb, var(--acc) 16%, transparent)}
.role.M{color:var(--gold);background:color-mix(in srgb, var(--gold) 16%, transparent)}
.acc .id{font-size:12px;color:var(--sec);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc .eq{font-size:18px;font-weight:700}
.acc .sub{font-size:12px}
.acc .dot{position:absolute;top:13px;right:12px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.lbl{font-size:10.5px;font-weight:700;letter-spacing:.7px;color:var(--mut);text-transform:uppercase}
.big{font-size:22px;font-weight:700;margin-top:3px}
.small{font-size:12px;color:var(--sec);margin-top:2px}
.status{display:flex;align-items:center;gap:10px}
.status .txt{font-weight:650;font-size:14px;flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}

/* tabs */
.tabs{position:sticky;top:calc(59px + env(safe-area-inset-top, 0px));z-index:10;display:flex;gap:4px;padding:4px;margin:12px 0 0;border-radius:13px;

.tabs button{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 4px;font-size:13px;font-weight:600;color:var(--sec);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--card);color:var(--txt);box-shadow:0 1px 0 var(--line), 0 4px 12px rgba(0,0,0,.18)}
.tabs .n{color:var(--mut);font-weight:600;margin-left:3px}

/* gauges */
.gauge{display:flex;flex-direction:column;align-items:center;text-align:center;padding:12px 6px 11px}
.ringbox{position:relative;width:74px;height:74px}
.ringbox svg{width:74px;height:74px;display:block}
.ringbox .c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringbox .c b{font-size:15px}
.ringbox .c span{font-size:9.5px;color:var(--mut);margin-top:-1px}
.gauge .lbl{margin-top:8px}
.gauge .v{font-size:15px;font-weight:700;margin-top:2px}
.gauge .s{font-size:11px;color:var(--sec)}

/* bars */
.bar{height:7px;border-radius:9px;background:var(--track);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--green)}
.kv{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:13px}
.kv + .kv{margin-top:8px}

/* lists */
.list{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.item{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.item .h{display:flex;align-items:center;gap:8px}
.item .name{font-weight:650;font-size:14.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .r{margin-left:auto;text-align:right;white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin-top:9px;text-align:center}
.stats div{background:var(--zebra);border-radius:9px;padding:6px 2px}
.stats b{display:block;font-size:15px}
.stats span{font-size:9.5px;font-weight:700;letter-spacing:.6px;color:var(--mut)}
.tri{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-top:8px}
.tri div{background:var(--zebra);border-radius:9px;padding:5px 8px}
.tri span{display:block;font-size:9.5px;font-weight:700;letter-spacing:.6px;color:var(--mut)}
.tri b{font-size:13px;font-weight:600}
.pl{margin-left:auto;font-size:17px;font-weight:700;white-space:nowrap}
.tag{font-size:10px;font-weight:700;letter-spacing:.5px;padding:2px 7px;border-radius:999px;white-space:nowrap}
.tag.buy{color:var(--green);background:color-mix(in srgb, var(--green) 16%, transparent)}
.tag.sell{color:var(--red);background:color-mix(in srgb, var(--red) 16%, transparent)}

.lot.up{color:var(--amber);background:color-mix(in srgb, var(--amber) 16%, transparent)}
.lot.dn{color:var(--acc);background:color-mix(in srgb, var(--acc) 16%, transparent)}
.lot.eq{color:var(--sec);background:color-mix(in srgb, var(--sec) 12%, transparent)}

.empty{padding:22px 10px;text-align:center;color:var(--mut);font-size:13px}
.spark{display:block;width:100%;height:30px;margin-top:6px}
.lat{display:block;width:100%;height:46px}
.row2{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}

.sheet{position:fixed;inset:0;z-index:50;background:rgba(5,8,15,.55);display:flex;align-items:flex-end}
.sheet .pan{width:100%;max-width:560px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;

.field{display:flex;flex-direction:column;gap:6px;margin-top:12px}
.field label{font-size:12px;font-weight:700;color:var(--sec)}
.field input{width:100%;font:inherit;font-size:14px;padding:11px 12px;border-radius:11px;border:1px solid var(--line);background:var(--bg);color:var(--txt)}

.btns{display:flex;gap:8px;margin-top:16px}

:focus-visible{outline:2px solid var(--acc);outline-offset:2px}

    const t = splitTag(e.m || "");

  }).join("") + "</div>";
}

//--- views --------------------------------------------------------------
function tabBar(id, list, cur) {
  return '<div class="tabs" role="tablist">' + list.map((t) => '<button role="tab" data-tab="' + t[0] + '" class="' + (cur === t[0] ? "on" : "") + '">' + esc(t[1]) +
    (t[2] != null ? '<span class="n">' + t[2] + "</span>" : "") + "</button>").join("") + "</div>";
}
function statusCard(a, chips) {
  const on = accOnline(a);
  const txt = on ? a.status : (/STOPPED/.test(a.status || "") ? a.status : "OFFLINE - no data for " + dur(accAge(a)));
  const k = on ? a.sk : 2;
  return '<div class="card"><div class="status"><span class="dot ' + (on ? (k === 1 ? "on" : k === 2 ? "off" : "warn") : "off") + '"></span><span class="txt" style="color:' + kcol(k) + '">' + esc(txt) + "</span></div>" +
    '<div class="chips">' + chips.join("") + "</div></div>";
}
const chip = (txt, color) => '<span class="chip" style="color:' + color + '">' + esc(txt) + "</span>";

function slaveView(a) {
  const tab = tabs[a.id] || "ov";
  const ms_ = a.masters || [], tr = a.trades || [];
  const mOn = ms_.filter((m) => m.live).length;
  const chips = [chip("MASTERS " + mOn + "/" + ms_.length, mOn === ms_.length ? "var(--green)" : mOn ? "var(--amber)" : "var(--red)")];
  if (a.turbo > 0) chips.push(chip((a.turbo < 5 ? "TURBO " : "TIMER ") + fmt(a.turbo, 1) + " ms", a.turbo < 5 ? "var(--green)" : "var(--sec)"));
  chips.push(chip(a.fast ? "FAST ORDERS" : "SYNC ORDERS", a.fast ? "var(--acc)" : "var(--sec)"));
  if (a.ping > 0) chips.push(chip("PING " + fmt(a.ping, 0) + " ms", "var(--sec)"));
  if (a.paused) chips.push(chip("PAUSED", "var(--amber)"));
  if (a.guard) chips.push(chip("GUARD: " + a.guard, "var(--red)"));
  let h = statusCard(a, chips);
  h += tabBar(a.id, [["ov", "Overview"], ["ms", "Masters", ms_.length], ["tr", "Trades", tr.length], ["ac", "Activity"]], tab);
  if (tab === "ms") return h + mastersList(a);
  if (tab === "tr") return h + tradesList(tr);
  if (tab === "ac") return h + '<div class="list">' + events(a.ev) + "</div>";
  //--- overview
  const eqUp = a.eq >= a.bal - 0.004;
  const tdp = a.init > 0 ? a.today / a.init * 100 : 0;
  h += '<div class="stack"><div class="grid2">' +
    '<div class="card"><div class="lbl">Balance ' + esc(a.ccy) + '</div><div class="big num">' + fmt(a.bal, 2) + '</div><div class="small">initial ' + short(a.init) + " (" + esc(a.initSrc) + ")</div></div>" +
    '<div class="card"><div class="lbl">Equity</div><div class="big num ' + (eqUp ? "" : "dn") + '">' + fmt(a.eq, 2) + "</div>" + spark(a.eqh, eqUp) + "</div>" +
    '<div class="card"><div class="lbl">Floating</div><div class="big num ' + pcls(a.flt) + '">' + sgn(a.flt, 2) + '</div><div class="small">' + (a.copies || 0) + " copies open</div></div>" +
    '<div class="card"><div class="lbl">Closed today</div><div class="big num ' + pcls(a.today) + '">' + sgn(a.today, 2) + '</div><div class="small">' + sgn(tdp, 2) + "% of initial</div></div></div>";
  //--- prop-firm gauges
  const g = (lbl, val, lim, target) => {
    if (!(lim > 0)) return '<div class="card gauge">' + ring(0, "var(--mut)", "OFF", "") + '<div class="lbl">' + lbl + '</div><div class="v mut">off</div><div class="s">&nbsp;</div></div>';
    const fr = Math.max(val, 0) / lim, col = target ? (fr >= 1 ? "var(--gold)" : "var(--acc)") : lossCol(fr);
    const vcol = target && val < 0 ? "var(--red)" : col;
    const room = target ? (fr >= 1 ? "TARGET REACHED" : "to go " + short((lim - val) / 100 * a.init)) : "room " + short(Math.max(lim - val, 0) / 100 * a.init);
    return '<div class="card gauge">' + ring(fr, col, Math.round(Math.min(fr, 9.99) * 100) + "%", target ? "done" : "used") +
      '<div class="lbl">' + lbl + '</div><div class="v num" style="color:' + vcol + '">' + (target ? sgn(val, 2) : fmt(val, 2)) + '%</div><div class="s num">' + room + "</div></div>";
  };
  h += '<div class="grid3">' + g("Daily loss", a.dl, a.dlLim, false) + g("Max loss", a.ml, a.mlLim, false) + g("Target", a.pp, a.ppTgt, true) + "</div>";
  //--- risk + lot size per master
  const rk = a.risk || 0, rm = a.room;
  let rcol = "var(--green)";
  if (!a.copies) rcol = "var(--mut)"; else if (rm >= 0) rcol = (rk <= 0 || rk < rm * 0.5) ? "var(--green)" : rk < rm ? "var(--amber)" : "var(--red)";
  const boosted = ms_.filter((m) => (m.lot || 100) !== 100);
  h += '<div class="card"><div class="row2"><div style="min-width:0"><div class="lbl">Lot size per master</div><div class="chips">' +
    (boosted.length ? boosted.map((m) => '<span class="lot ' + (m.lot > 100 ? "up" : "dn") + ' num">' + esc(m.id) + " " + m.lot + "%</span>").join("") : '<span class="small">all masters 100% = same lot</span>') +
    '</div></div><div style="text-align:right;flex:none"><div class="lbl">If all SL hit</div><div class="big num" style="color:' + rcol + '">' + (rk > 0 ? "-" + fmt(rk, 2) : "0.00") + "%</div>" +
    '<div class="small ' + (a.noSL > 0 ? "k3" : "") + '">' + (!a.copies ? "no open copies" : a.noSL > 0 ? a.noSL + " without SL!" : rm >= 0 ? "room " + fmt(rm, 2) + "%" : "no loss limit set") + "</div></div></div></div>";
  //--- limits
  h += '<div class="card"><div class="kv"><span class="sec">Requests today</span><span class="num"><b>' + (a.req || 0) + "</b> / " + a.reqMax + "</span></div>" + bar((a.req || 0) / (a.reqMax || 1), lossCol((a.req || 0) / (a.reqMax || 1))) +
    '<div class="kv" style="margin-top:10px"><span class="sec">Open positions</span><span class="num"><b>' + (a.pos || 0) + "</b> / " + a.posMax + "</span></div>" + bar((a.pos || 0) / (a.posMax || 1), lossCol((a.pos || 0) / (a.posMax || 1))) +
    '<div class="chips">' + chip(a.news || "", kcol(a.newsK)) + chip("TRADING DAYS " + (a.days || 0), "var(--sec)") + "</div></div>";
  //--- speed
  const L = a.lat || {};
  h += '<div class="card"><div class="row2"><div><div class="lbl">Execution speed</div><div class="big num" style="color:' + (L.n ? (L.last < 100 ? "var(--green)" : L.last < 250 ? "var(--amber)" : "var(--red)") : "var(--sec)") + '">' + (L.n ? ms(L.last) : "--") + "</div>" +
    '<div class="small">' + (L.n ? "signal " + ms(L.sig) + " + broker " + ms(L.brk) : "waiting for the first copy") + '</div></div><div style="text-align:right" class="small num">' +
    "<div><b style=\"color:var(--txt)\">AVG " + (L.n ? ms(L.avg) : "-") + "</b></div><div>BEST " + (L.n ? ms(L.best) : "-") + "</div><div>SLIP " + (L.slip != null ? sgn(L.slip, 1) + " pts" : "-") + "</div></div></div>" +
    '<div class="lbl" style="margin:10px 0 6px">Last 40 copies</div>' + latBars(L.hist) + "</div>";
  const d = a.day || {};
  h += '<div class="chips" style="margin-top:0">' + chip("COPIES " + (d.copies || 0), "var(--green)") + chip("SKIPS " + (d.skips || 0), d.skips ? "var(--red)" : "var(--mut)") +
    chip("CLOSES " + (d.closes || 0), "var(--acc)") + chip("HEALS " + (d.heals || 0), d.heals ? "var(--amber)" : "var(--mut)") + chip("AVG SPEED " + (d.avg != null ? ms(d.avg) : "-"), "var(--sec)") + "</div>";
  h += '<div class="small mut" style="margin-top:4px">' + esc(a.id) + " | " + esc(a.broker) + " | lots: " + esc(a.lots || "") + "</div>";
  return h + "</div>";
}
function mastersList(a) {
  const list = a.masters || [];
  if (!list.length) return '<div class="empty">No masters yet.</div>';
  return '<div class="list">' + list.map((m) => {
    const st = !m.live ? chip("OFFLINE", "var(--red)") : !m.on ? chip("OFF", "var(--red)") : chip("COPY ON", "var(--green)");
    let det = [];
    if (m.speed != null) det.push("speed " + ms(m.speed));
    if (m.slip != null) det.push("slip " + sgn(m.slip, 1) + " pts");
    if (!det.length) det.push(m.q ? "turbo queue linked" : m.ver && m.ver < 600 ? "classic files (update to v6)" : "waiting for data");
    return '<div class="item"><div class="h"><span class="dot ' + (m.live ? (m.ready ? "on" : "warn") : "off") + '"></span><span class="name">' + esc(m.id) + "</span>" + lotPill(m.lot) + '<span class="r">' + st + "</span></div>" +
      '<div class="small" style="margin:3px 0 0 16px">' + esc(short(m.bal)) + " " + esc(m.ccy) + " | " + esc(m.broker) + (m.x && Math.abs(m.x - (m.lot || 100) / 100) > 0.001 ? " | factor x" + fmt(m.x, 2) : "") + "</div>" +
      '<div class="stats num"><div><b>' + m.sig + "</b><span>SIG</span></div><div><b class=\"up\">" + m.cop + "</b><span>COPIED</span></div><div><b class=\"" + (m.skip ? "dn" : "mut") + "\">" + m.skip +
      "</b><span>SKIP</span></div><div><b>" + m.open + "</b><span>OPEN</span></div></div>" +
      '<div class="kv" style="margin-top:9px"><span class="small">' + esc(det.join("   ")) + (m.lag ? ' <b class="k3">LAGGING</b>' : "") + '</span><span class="num"><span class="' + pcls(m.flt) + '">' + sgn(m.flt, 2) +
      '</span> <span class="mut">|</span> <span class="' + pcls(m.today) + '">' + sgn(m.today, 2) + "</span></span></div></div>";
  }).join("") + '<div class="small mut">Change LOT size and COPY on/off in the MASTERS tab on the PC.</div></div>';
}
function tri(t) {
  return '<div class="tri num"><div><span>OPEN</span><b>' + (t.open > 0 ? t.open : "-") + '</b></div><div><span>SL</span><b>' + (t.sl > 0 ? t.sl : "-") +
    '</b></div><div><span>TP</span><b>' + (t.tp > 0 ? t.tp : "-") + "</b></div></div>";
}
function tradesList(tr) {
  if (!tr.length) return '<div class="empty">No copied trades open.</div>';
  return '<div class="list">' + tr.map((t) => '<div class="item"><div class="h"><span class="tag ' + (t.d > 0 ? "buy" : "sell") + '">' + (t.d > 0 ? "BUY" : "SELL") + '</span><span class="name">' + esc(t.sym) +
    ' <span class="num">' + fmt(t.lots, 2) + '</span></span><span class="pl num ' + pcls(t.pl) + '">' + sgn(t.pl, 2) + "</span></div>" +
    '<div class="small" style="margin-top:3px">from ' + esc(t.m || "?") + "</div>" + tri(t) + "</div>").join("") + "</div>";
}
function masterView(a) {
  const tab = tabs[a.id] || "ov";
  const sl = a.slaves || [], ps = a.pos || [];
  const son = sl.filter((s) => s.live).length;
  const chips = [chip("SLAVES " + son + "/" + sl.length, !sl.length ? "var(--mut)" : son === sl.length ? "var(--green)" : son ? "var(--amber)" : "var(--red)"), chip("EVENT ENGINE", "var(--green)")];
  if (a.legacy) chips.push(chip("v5 COMPAT ON", "var(--amber)"));
  if (a.wait > 0) chips.push(chip("QUEUE BUSY " + a.wait, "var(--amber)"));
  if (a.ping > 0) chips.push(chip("PING " + fmt(a.ping, 0) + " ms", "var(--sec)"));
  let h = statusCard(a, chips);
  h += tabBar(a.id, [["ov", "Overview"], ["ps", "Positions", ps.length], ["ac", "Activity"]], tab);
  if (tab === "ps") {
    if (!ps.length) return h + '<div class="empty">No copyable positions open.</div>';
    return h + '<div class="list">' + ps.map((p) => {
      const cc = !p.tot ? "var(--mut)" : p.got === p.tot ? "var(--green)" : p.got > 0 ? "var(--amber)" : "var(--red)";
      return '<div class="item"><div class="h"><span class="tag ' + (p.d > 0 ? "buy" : "sell") + '">' + (p.d > 0 ? "BUY" : "SELL") + '</span><span class="name">' + esc(p.sym) + ' <span class="num">' + fmt(p.lots, 2) +
        '</span></span><span class="pl num ' + pcls(p.pl) + '">' + sgn(p.pl, 2) + "</span></div>" +
        '<div class="kv" style="margin-top:4px"><span class="small num">#' + p.tk + " | magic " + p.mg + '</span><span class="chip num" style="color:' + cc + '">' + (p.tot ? p.got + "/" + p.tot + " copied" : "no slaves") + "</span></div>" + tri(p) + "</div>";
    }).join("") + "</div>";
  }
  if (tab === "ac") return h + '<div class="list">' + events(a.ev) + "</div>";
  const eqUp = a.eq >= a.bal - 0.004;
  h += '<div class="stack"><div class="grid2">' +
    '<div class="card"><div class="lbl">Balance ' + esc(a.ccy) + '</div><div class="big num">' + fmt(a.bal, 2) + '</div><div class="small">magics ' + esc(a.mags || "-") + "</div></div>" +
    '<div class="card"><div class="lbl">Equity</div><div class="big num ' + (eqUp ? "" : "dn") + '">' + fmt(a.eq, 2) + "</div>" + spark(a.eqh, eqUp) + "</div>" +
    '<div class="card"><div class="lbl">Floating (copied)</div><div class="big num ' + pcls(a.flt) + '">' + sgn(a.flt, 2) + '</div><div class="small">' + ps.length + " positions</div></div>" +
    '<div class="card"><div class="lbl">Signals today</div><div class="big num">' + (a.sigToday || 0) + '</div><div class="small">last ' + esc(a.lastSig || "-") + "</div></div></div>";
  h += '<div class="card"><div class="row2"><div><div class="lbl">Turbo broadcast engine</div><div class="big" style="color:' + (a.live ? "var(--green)" : "var(--amber)") + '">' + (a.live ? "LIVE" : "STARTING") +
    '</div><div class="small num">queue seq ' + (a.qseq || 0) + '</div></div><div class="small num" style="text-align:right"><div>write <b style="color:var(--txt)">' + (a.wr > 0 ? (a.wr < 1000 ? fmt(a.wr, 0) + " us" : ms(a.wr / 1000)) : "-") +
    "</b></div><div>queue " + (a.qsize < 1024 ? a.qsize + " B" : fmt(a.qsize / 1024, 1) + " KB") + "</div><div>sent " + (a.sigSent || 0) + "</div></div></div></div>";
  h += '<div class="lbl" style="margin:4px 2px 0">Target accounts</div>';
  h += sl.length ? '<div class="list" style="margin-top:0">' + sl.map((s) => {
    const k = s.state === "COPYING" ? "var(--green)" : /GUARD|ALGO OFF|OFFLINE|STOPPED/.test(s.state) ? "var(--red)" : "var(--amber)";
    return '<div class="item"><div class="h"><span class="dot ' + (s.live ? "on" : "off") + '"></span><span class="name">' + esc(s.id) + "</span>" + (s.lot && s.lot !== 100 ? lotPill(s.lot) : "") +
      '<span class="r">' + chip(s.state, k) + '</span></div><div class="kv" style="margin-top:6px"><span class="small">' + esc(s.broker) + '</span><span class="num ' + pcls(s.eq - s.bal) + '">' + short(s.eq) + " " + esc(s.ccy) +
      ' <span class="small mut">' + s.open + " open</span></span></div></div>";
  }).join("") + "</div>" : '<div class="empty">No slaves seen yet.</div>';
  return h + "</div>";
}

//--- page ---------------------------------------------------------------
function header() {
  const hd = $("hdot"), hl = $("hlive");
  if (conn.mode === "demo") { hd.className = "dot warn"; hl.textContent = "demo data - tap the gear to connect"; return; }
  if (!state.meta) { hd.className = "dot warn"; hl.textContent = conn.err ? "not connected" : "connecting..."; return; }
  const b = bridge();
  if (b.stale) { hd.className = "dot off"; hl.textContent = "PC offline - last update " + dur(b.age) + " ago"; return; }
  hd.className = "dot on";
  hl.textContent = "live - updated " + dur(Math.max(0, (Date.now() - conn.lastMsg) / 1000)) + " ago";
}
function banner() {
  const b = $("banner");
  let h = "";
  if (conn.mode === "demo") h = '<div class="banner demo"><span><b>Demo data.</b> Connect the TBFE Cloud Bridge on your PC to see your real accounts.</span><button id="bConnect">Connect</button></div>';
  else if (conn.err) h = '<div class="banner err"><span><b>Problem:</b> ' + esc(conn.err) + '</span><button id="bConnect">Settings</button></div>';
  else if (state.meta && bridge().stale)
    h = '<div class="banner"><span><b>No new data for ' + dur(bridgeAge()) + '.</b> The PC, MT5 or the Cloud Bridge EA is off, or the internet is down. Figures below are the last ones received.</span></div>';
  if (b.innerHTML !== h) b.innerHTML = h;
  const c = $("bConnect"); if (c) c.onclick = openSettings;
}
let lastHtml = "";
function render() {
  header();
  banner();
  const list = accList();
  if (!list.length) {
    $("sum").innerHTML = ""; $("strip").innerHTML = "";
    const h = '<div class="card empty" style="margin-top:14px">' + (conn.mode === "stream" || conn.mode === "poll" ? "Connected. Waiting for the first data from your PC (TBFE Cloud Bridge sends every few seconds)..." : "No data.") + "</div>";
    if (h !== lastHtml) { $("view").innerHTML = h; lastHtml = h; }
    return;
  }
  if (!sel || !list.some((a) => a.id === sel)) sel = list[0].id;
  //--- summary chips
  const sl = list.filter((a) => a.role === "S"), mm = list.filter((a) => a.role === "M");
  const sOn = sl.filter(accOnline).length, mOn = mm.filter(accOnline).length;
  const maxRisk = Math.max(0, ...sl.map((a) => a.risk || 0));
  $("sum").innerHTML = chip("FUNDED " + sOn + "/" + sl.length + " online", sOn === sl.length ? "var(--green)" : "var(--amber)") +
    chip("MASTERS " + mOn + "/" + mm.length + " online", mOn === mm.length ? "var(--green)" : "var(--amber)") +
    (sl.length ? chip("MAX SL RISK " + fmt(maxRisk, 2) + "%", "var(--sec)") : "");
  //--- account strip
  $("strip").innerHTML = list.map((a) => {
    const on = accOnline(a), sub = a.role === "S" ? sgn(a.today + a.flt, 2) + " today" : (a.pos || []).length + " pos | " + (a.sigToday || 0) + " signals";
    const subc = a.role === "S" ? pcls(a.today + a.flt) : "sec";
    return '<button class="acc' + (a.id === sel ? " sel" : "") + '" data-acc="' + esc(a.id) + '"><span class="row"><span class="role ' + a.role + '">' + (a.role === "S" ? "SLAVE" : "MASTER") + '</span></span>' +
      '<span class="dot ' + (on ? (a.sk === 1 ? "on" : a.sk === 2 ? "off" : "warn") : "off") + '"></span>' +
      '<span class="id">' + esc(a.id) + '</span><span class="eq num">' + fmt(a.eq, 2) + '</span><span class="sub num ' + subc + '">' + sub + "</span></button>";
  }).join("");
  const a = list.find((x) => x.id === sel);
  const h = a.role === "S" ? slaveView(a) : masterView(a);
  if (h !== lastHtml) { $("view").innerHTML = h; lastHtml = h; }
}
document.addEventListener("click", (e) => {
  const acc = e.target.closest("[data-acc]");
  if (acc) { sel = acc.getAttribute("data-acc"); LS.set("tbfe.sel", sel); lastHtml = ""; render(); return; }
  const t = e.target.closest("[data-tab]");
  if (t && sel) { tabs[sel] = t.getAttribute("data-tab"); LS.set("tbfe.tabs", tabs); lastHtml = ""; render(); }
});
setInterval(() => { header(); banner(); }, 1000);
setInterval(() => { if (conn.mode !== "demo") render(); }, 5000);          // stale accounts turn grey even when no data comes

//--- settings -----------------------------------------------------------
function paintSkin() { document.querySelectorAll("#fSkin button").forEach((b) => b.classList.toggle("on", b.getAttribute("data-s") === (cfg.skin || "midnight"))); }
function openSettings() {
  $("fDb").value = cfg.db || ""; $("fKey").value = cfg.key || "";
  paintSkin();
  $("setHint").hidden = !!window.navigator.standalone;
  $("sheet").hidden = false;
}
$("openSet").onclick = openSettings;
$("setClose").onclick = () => { $("sheet").hidden = true; };
$("sheet").addEventListener("click", (e) => { if (e.target === $("sheet")) $("sheet").hidden = true; });
document.querySelectorAll("#fSkin button").forEach((b) => b.onclick = () => { cfg.skin = b.getAttribute("data-s"); LS.set("tbfe.cfg", cfg); setSkin(cfg.skin); paintSkin(); lastHtml = ""; render(); });
$("setDemo").onclick = () => { cfg.demo = true; LS.set("tbfe.cfg", cfg); $("sheet").hidden = true; connect(); };
$("setSave").onclick = () => {
  const db = $("fDb").value.trim().replace(/\/+$/, ""), key = $("fKey").value.trim();
  if (!/^https:\/\//.test(db)) { $("fDb").focus(); $("fDb").style.borderColor = "var(--red)"; return; }
  if (key.length < 24) { $("fKey").focus(); $("fKey").style.borderColor = "var(--red)"; return; }
  cfg.db = db; cfg.key = key; cfg.demo = false;
  LS.set("tbfe.cfg", cfg);
  //--- keep the settings in the address, so "Add to Home Screen" saves a ready-to-use app
  try { history.replaceState(null, "", location.pathname + "?db=" + encodeURIComponent(db) + "&key=" + encodeURIComponent(key)); } catch (e) {}
  $("sheet").hidden = true;
  state = { meta: null, acc: {} }; lastHtml = "";
  connect();
};
connect();
</script>
</body>
</html>
